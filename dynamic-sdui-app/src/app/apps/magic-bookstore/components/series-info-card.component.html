@if (series(); as series) {
  <div class="series-card">
    <mat-icon class="series-icon">collections_bookmark</mat-icon>
    <div class="series-details">
      <span class="series-name">{{ series.name }}</span>
      <span class="series-number">Book {{ series.number }}</span>
    </div>
  </div>
}
