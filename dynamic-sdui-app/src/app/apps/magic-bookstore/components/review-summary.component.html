<div class="review-summary">
  @if (averageRating()) {
    <app-rating-stars [rating]="averageRating()"></app-rating-stars>
  }
  @if (reviewCount() !== undefined) {
    <span class="review-count">({{ reviewCount() }} reviews)</span>
  }
</div>
