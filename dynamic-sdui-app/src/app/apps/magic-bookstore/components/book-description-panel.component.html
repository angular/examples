@if (description(); as description) {
  <div class="description-panel">
    <h3 class="panel-title">Description</h3>
    <p class="book-description">
      {{ displayDescription }}
    </p>
    @if (showToggle) {
      <button class="read-more-button" (click)="toggleExpand()">
        {{ isExpanded() ? 'Read Less' : 'Read More' }}
      </button>
    }
  </div>
}
