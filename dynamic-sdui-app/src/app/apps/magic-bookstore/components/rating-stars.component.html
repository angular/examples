<div class="star-rating">
  @for (star of [].constructor(maxStars); track $index) {
    <mat-icon class="star-icon" [class.filled]="getStarIcon($index) === 'star'" [class.half-filled]="getStarIcon($index) === 'star_half'">
      {{ getStarIcon($index) }}
    </mat-icon>
  }
</div>
