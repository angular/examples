<div class="topic-card" (click)="updatePrompt()">
  @if (topic()) {
    <h3 [innerHTML]="topic() | formatInlineCode"></h3>
  }
  @if (description()) {
    <p [innerHTML]="description() | formatInlineCode"></p>
  }
</div>
