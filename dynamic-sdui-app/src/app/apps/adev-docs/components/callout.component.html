@if (content()) {
  <div class="callout" [ngClass]="calloutClass">
    <div class="callout-icon">
      @switch (type()) {
        @case ('info') { ℹ️ }
        @case ('warning') { ⚠️ }
        @case ('danger') { 🛑 }
        @case ('tip') { 💡 }
        @default { ℹ️ }
      }
    </div>
    <div class="callout-content" [innerHTML]="content() | formatInlineCode"></div>
  </div>
}
